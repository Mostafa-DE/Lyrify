[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
datastore = "1.3.0"
serialization = "1.12.0"
coroutines = "1.11.0"
junit = "4.13.2"
# Latest stable on Google Maven on 2026-11-01 (onTimeout handling for foreground workers since 2.10).
work = "2.12.0"
# The NPU stack, exactly as measured on the phone by lyrify-npu-spike and matched to the AI Hub Whisper assets
# (Whisper-Large-V3-Turbo v0.65.0, precompiled_qnn_onnx, built with QAIRT 2.50.0.260828221209 and ONNX Runtime 1.30.0).
# ONNX Runtime core: the version the assets were exported with (the QNN plugin EP needs >= 1.24.1).
onnxruntime = "1.30.0"
# Qualcomm's plugin QNN execution provider (github.com/onnxruntime/onnxruntime-qnn): 2.6.0 is the release built and tested
# with QAIRT 2.50 (2.7.0 moved to QAIRT 2.51). The AAR holds only libonnxruntime_providers_qnn.so.
qnnEp = "2.6.0"
# The QNN runtime libraries (libQnnHtp.so, the Hexagon stub and skel libraries): build v2.50.0.260828221209, the QAIRT
# build AI Hub compiled the Whisper context binaries with.
qnnRuntime = "2.50.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
onnxruntime-qnn-ep = { group = "com.qualcomm.qti", name = "onnxruntime-android-qnn", version.ref = "qnnEp" }
qnn-runtime = { group = "com.qualcomm.qti", name = "qnn-runtime", version.ref = "qnnRuntime" }
# The JVM build of the same ONNX Runtime, for unit tests only: IoTensorsTest runs the app's uint16 tensors (made by
# reflection into ONNX Runtime's Java classes) through it on the laptop.
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
